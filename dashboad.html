
<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nour Academy | Dashboard</title>
  <link href="/src/style.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-bg text-text">

  <!-- Header -->
  <header class="flex h-20 items-center justify-between border-b border-border bg-surface px-4 sm:px-6 lg:px-8">

    <div class="flex items-center gap-2">
      <a href="index.html">
        <img
          src="src/assets/logo.webp"
          alt="Nour Academy logo"
          class="h-12 w-auto"
        >
      </a>

      <p class="-ml-2 text-xl font-bold leading-tight text-primary">
        Nour<br>academy
      </p>
    </div>

    <button
      id="menuToggle"
      type="button"
      aria-label="Ouvrir le menu"
      aria-expanded="false"
      class="flex h-11 w-11 items-center justify-center rounded-lg border border-border text-2xl text-primary transition hover:bg-surface-soft lg:hidden">☰</button>

  </header>


  <!-- Layout -->
  <div class="flex min-h-screen">

    <aside
      id="sidebar"
      class="fixed inset-y-20 left-0 z-50 flex w-[280px] -translate-x-full flex-col gap-4 overflow-y-auto bg-primary px-5 py-6 transition-transform duration-300 lg:sticky lg:top-0 lg:h-screen lg:shrink-0 lg:translate-x-0"
    >

      <a
        id="dashboardbtn"
        class="flex items-center gap-3 rounded-xl bg-white/10 px-4 py-3 font-medium text-white transition hover:bg-white/20"
      >
        <span>▦</span>
        Tableau de bord
      </a>

      <a
        id="inscriptionbtn"
        class="flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-white transition hover:bg-white/10"
      >
        <span>☷</span>
        Inscriptions
      </a>

    </aside>


    <!-- Main content -->
    <main id="dashboard" class="min-w-0 flex-1 bg-bg p-4 sm:p-6 lg:p-8">


    </main>

  </div>
  <script type="module" src="./dashboard.js"></script></body>
</html>
